<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voxel Bridge Challenge</title>
<style>
:root {
  --bg: #0d1117;
  --panel: #161b22;
  --panel-edge: #30363d;
  --text: #e6edf3;
  --text-dim: #8b949e;
  --accent: #58a6ff;
  --good: #3fb950;
  --warn: #d29922;
  --bad: #f85149;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  font-size: 14px;
}
#c { position: fixed; inset: 0; display: block; }

#title {
  position: fixed;
  top: 18px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 26px;
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--text);
  text-shadow: 0 2px 12px rgba(0,0,0,.8), 0 0 24px rgba(88,166,255,.25);
  z-index: 5;
}

#model-badge {
  position: fixed;
  top: 52px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1px;
  color: var(--accent);
  background: rgba(22, 27, 34, .82);
  border: 1px solid var(--panel-edge);
  border-radius: 999px;
  padding: 4px 14px;
  pointer-events: none;
  z-index: 5;
}

#controls {
  position: fixed;
  left: 18px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 10px;
  z-index: 6;
  width: 168px;
}
#controls button {
  padding: 12px 14px;
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  background: linear-gradient(180deg, #21262d, #161b22);
  border: 1px solid var(--panel-edge);
  border-radius: 10px;
  cursor: pointer;
  transition: border-color .15s, transform .1s, box-shadow .15s;
  box-shadow: 0 2px 6px rgba(0,0,0,.4);
}
#controls button:hover:not(:disabled) {
  border-color: var(--accent);
  box-shadow: 0 0 12px rgba(88,166,255,.25);
}
#controls button:active:not(:disabled) { transform: scale(.97); }
#controls button:disabled {
  opacity: .38;
  cursor: not-allowed;
}
#btn-build  { border-left: 3px solid #3fb950; }
#btn-quake  { border-left: 3px solid #f85149; }
#btn-widen  { border-left: 3px solid #58a6ff; }
#btn-reset  { border-left: 3px solid #8b949e; }

#hud {
  position: fixed;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 14px;
  padding: 8px 18px;
  background: rgba(22, 27, 34, .82);
  border: 1px solid var(--panel-edge);
  border-radius: 999px;
  backdrop-filter: blur(6px);
  z-index: 6;
  font-variant-numeric: tabular-nums;
  font-size: 13px;
  color: var(--text-dim);
}
#hud b { color: var(--text); font-weight: 700; }
#hud .sep { color: var(--panel-edge); }

#log-wrap {
  position: fixed;
  right: 18px;
  top: 50%;
  transform: translateY(-50%);
  width: 330px;
  max-height: 72vh;
  display: flex;
  flex-direction: column;
  background: rgba(22, 27, 34, .88);
  border: 1px solid var(--panel-edge);
  border-radius: 12px;
  backdrop-filter: blur(6px);
  z-index: 6;
  box-shadow: 0 8px 28px rgba(0,0,0,.45);
}
#log-title {
  padding: 10px 14px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text-dim);
  border-bottom: 1px solid var(--panel-edge);
}
#log {
  overflow-y: auto;
  padding: 10px 12px;
  scrollbar-width: thin;
  scrollbar-color: var(--panel-edge) transparent;
  min-height: 120px;
}
#log::-webkit-scrollbar { width: 6px; }
#log::-webkit-scrollbar-thumb { background: var(--panel-edge); border-radius: 3px; }
.log-entry {
  padding: 7px 10px;
  margin-bottom: 6px;
  border-radius: 8px;
  background: rgba(88, 166, 255, .06);
  border-left: 3px solid var(--accent);
  font-size: 12.5px;
  line-height: 1.45;
  animation: slidein .28s ease-out;
}
.log-entry .t {
  display: inline-block;
  font-variant-numeric: tabular-nums;
  font-weight: 700;
  color: var(--accent);
  margin-right: 6px;
}
.log-entry.quake { border-left-color: var(--bad); }
.log-entry.quake .t { color: var(--bad); }
.log-entry.build { border-left-color: var(--good); }
.log-entry.build .t { color: var(--good); }
.log-entry.widen { border-left-color: var(--warn); }
.log-entry.widen .t { color: var(--warn); }
.log-entry.info { border-left-color: var(--text-dim); }
.log-entry.info .t { color: var(--text-dim); }
@keyframes slidein {
  from { opacity: 0; transform: translateX(14px); }
  to   { opacity: 1; transform: none; }
}
.log-empty { color: var(--text-dim); font-size: 12.5px; padding: 8px 10px; font-style: italic; }

</style>
</head>
<body>
<div id="title">Voxel Bridge Challenge</div>
<div id="model-badge">Model: glm5.3-flash-exl3-dual</div>
<div id="controls">
  <button id="btn-build">Build Bridge</button>
  <button id="btn-quake">Earthquake</button>
  <button id="btn-widen">Widen River</button>
  <button id="btn-reset">Reset</button>
</div>
<div id="hud">
  <span id="hud-blocks">Blocks: 0</span>
  <span id="hud-river">River: 10 u</span>
</div>
<div id="log-wrap">
  <div id="log-title">Reasoning Log</div>
  <div id="log"></div>
</div>

<script>
window.__appBoot = () => { window.__appReady = true; };
/* ================= Voxel Bridge Challenge =================
   Geometry contract (all block counts exact):
   - River spans x = 0..W-1 water (W=10 initially, 14 when widened).
     West bank face at x = -0.5, east bank face at x = W - 0.5.
   - Lanes z = 0, 1 (bridge two blocks wide).
   - Ground plane surface y = -0.5. River bed surface y = -1.5.
     Water surface y = -0.7. Bank terrain tops y = 1.5 (deck level).
   - ORIGINAL bridge (40): arch row y=0 x=0..9 z=0..1 (20 blocks)
     + walkway y=1 x=0..9 z=0..1 (20 blocks) = 40.
   - Central pier = arch blocks at x=4, z=0 & z=1 (the "two central
     support blocks"). Earthquake destroys them -> 38 remain.
   - REBUILD (38): move arch end blocks (0,0,0) and (9,0,1) into the
     pier positions; end decks cantilever onto the bank abutments.
   - WIDEN to 14 (38): river x=0..13. Deck grows to x=0..13 (28
     blocks: old 20 stay, 8 arch blocks relocate), remaining 10 arch
     blocks form a single keel spine y=0, z=0.5, x=2..11 under the
     deck's inner edges. Same 38 blocks, zero loss.
   ========================================================= */
(function () {
  'use strict';

  const V = THREE; // local alias

  /* ---------------- constants ---------------- */
  const RIVER0 = 10, RIVER1 = 14;
  const COLORS = {
    red:    0xd94f3d,
    blue:   0x3d7bd9,
    green:  0x43a047,
    yellow: 0xf2b705,
  };
  const PAL = ['red', 'blue', 'green', 'yellow'];
  // deterministic pleasing color per grid cell (same formula for every stage)
  const colorOf = (x, y, z) => PAL[(x + (y ? 2 : 0) + z) % 4];

  const ARCH_Y = 0, DECK_Y = 1, SPINE_Z = 0.5;

  /* ---------------- state ---------------- */
  const S = {
    river: RIVER0,
    phase: 'idle',          // idle | building | built | quake | rebuilding | rebuilt | widening | widened
    blocks: new Map(),      // id -> {mesh, gx,gy,gz, color, role}
    nextId: 1,
    busy: false,
    clock: null,
    anims: [],              // active tweens
    water: null, bed: null, bankW: null, bankE: null, bankGrp: null,
    logT0: 0,
    count: 0,
  };

  /* ---------------- three setup ---------------- */
  const canvas = document.getElementById('c');
  const renderer = new V.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = V.PCFSoftShadowMap;
  renderer.outputColorSpace = V.SRGBColorSpace;
  renderer.toneMapping = V.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;

  const scene = new V.Scene();
  scene.background = new V.Color(0x0d1117);
  scene.fog = new V.Fog(0x0d1117, 55, 110);

  const camera = new V.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.1, 300);

  /* ---- orbiting camera (simple spherical orbit + drag/zoom) ---- */
  const orbit = {
    theta: -1.1, phi: 1.02, r: 17,
    target: new V.Vector3(4.5, 0.9, 0.5),
    drag: false, px: 0, py: 0,
    thetaV: 0, // auto-rotate
  };
  function applyCamera() {
    const sp = new V.Spherical(orbit.r, Math.max(0.25, Math.min(1.45, orbit.phi)), orbit.theta);
    camera.position.setFromSpherical(sp).add(orbit.target);
    camera.lookAt(orbit.target);
  }
  canvas.addEventListener('pointerdown', e => { orbit.drag = true; orbit.px = e.clientX; orbit.py = e.clientY; });
  window.addEventListener('pointerup', () => orbit.drag = false);
  window.addEventListener('pointermove', e => {
    if (!orbit.drag) return;
    orbit.theta -= (e.clientX - orbit.px) * 0.005;
    orbit.phi   -= (e.clientY - orbit.py) * 0.005;
    orbit.phi = Math.max(0.25, Math.min(1.45, orbit.phi));
    orbit.px = e.clientX; orbit.py = e.clientY;
  });
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    orbit.r = Math.max(12, Math.min(70, orbit.r + e.deltaY * 0.02));
  }, { passive: false });

  /* ---------------- lights ---------------- */
  const hemi = new V.HemisphereLight(0xbfd4ff, 0x2e2a24, 0.55);
  scene.add(hemi);
  const sun = new V.DirectionalLight(0xffe8c8, 1.9); // warm key light
  sun.position.set(18, 26, 10);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -30; sun.shadow.camera.right = 34;
  sun.shadow.camera.top = 24;   sun.shadow.camera.bottom = -24;
  sun.shadow.camera.far = 80;
  sun.shadow.bias = -0.0004;
  sun.shadow.normalBias = 0.02;
  scene.add(sun);
  const rim = new V.DirectionalLight(0xff9d5c, 0.85); // warm rim from behind
  rim.position.set(-22, 9, -16);
  scene.add(rim);
  const fill = new V.DirectionalLight(0x8fb7ff, 0.28); // cool fill
  fill.position.set(6, 8, -18);
  scene.add(fill);
  scene.add(new V.AmbientLight(0x404a58, 0.5));

  /* ---------------- rounded voxel geometry ---------------- */
  function roundedVoxelGeometry(size, radius, bevelSeg, curveSeg) {
    const half = size / 2, r = radius;
    const k = half - r;
    const shape = new V.Shape();
    shape.moveTo(-k, -half);
    shape.lineTo(k, -half);
    shape.absarc(k, -k, r, -Math.PI / 2, 0);
    shape.lineTo(half, k);
    shape.absarc(k, k, r, 0, Math.PI / 2);
    shape.lineTo(-k, half);
    shape.absarc(-k, k, r, Math.PI / 2, Math.PI);
    shape.lineTo(-half, -k);
    shape.absarc(-k, -k, r, Math.PI, Math.PI * 1.5);
    // extrude along +Z then rotate so extrusion becomes the Y axis
    const geo = new V.ExtrudeGeometry(shape, {
      depth: size - 2 * r,
      bevelEnabled: true,
      bevelThickness: r,
      bevelSize: r,
      bevelSegments: bevelSeg,
      curveSegments: curveSeg,
    });
    geo.center();
    geo.rotateX(-Math.PI / 2);
    geo.computeVertexNormals();
    return geo;
  }
  const VOXEL_GEO = roundedVoxelGeometry(0.98, 0.13, 3, 5);

  const MATS = {};
  for (const name of PAL) {
    MATS[name] = new V.MeshStandardMaterial({
      color: COLORS[name],
      roughness: 0.62,
      metalness: 0.05,
    });
  }

  /* ---------------- static terrain ---------------- */
  function buildTerrain(w) {
    const grp = new V.Group();

    // river bed
    const bedMat = new V.MeshStandardMaterial({ color: 0x2a2320, roughness: 1 });
    const bed = new V.Mesh(new V.BoxGeometry(w, 1, 14), bedMat);
    bed.position.set((w - 1) / 2, -2, 0.5);
    bed.receiveShadow = true;
    grp.add(bed);

    // water slab (semi transparent blue)
    const waterMat = new V.MeshStandardMaterial({
      color: 0x2b6fd4, roughness: 0.15, metalness: 0.25,
      transparent: true, opacity: 0.82,
    });
    const water = new V.Mesh(new V.BoxGeometry(w, 0.8, 14), waterMat);
    water.position.set((w - 1) / 2, -1.1, 0.5);
    water.receiveShadow = true;
    grp.add(water);

    // banks: solid boxes with grassy top band
    const bankBodyMat = new V.MeshStandardMaterial({ color: 0x4a3b2c, roughness: 1 });
    const bankTopMat = new V.MeshStandardMaterial({ color: 0x3f7d3a, roughness: 0.95 });
    const bankDepth = 3.0, bankTopY = 1.5;
    function bank(side) { // side: -1 west, +1 east
      const g = new V.Group();
      const faceX = side < 0 ? -0.5 : w - 0.5;
      const bw = 16;
      const cx = faceX + side * bw / 2;
      const body = new V.Mesh(new V.BoxGeometry(bw, bankDepth - 0.5, 14), bankBodyMat);
      body.position.set(cx, bankTopY - 0.25 - (bankDepth - 0.5) / 2 + 0.5, 0.5);
      // simpler: body spans y in [-2, bankTopY-0.5]
      body.position.y = (bankTopY - 0.5 + (-2)) / 2;
      body.receiveShadow = true; body.castShadow = false;
      g.add(body);
      const top = new V.Mesh(new V.BoxGeometry(bw, 0.5, 14), bankTopMat);
      top.position.set(cx, bankTopY - 0.25, 0.5);
      top.receiveShadow = true; top.castShadow = true;
      g.add(top);
      return g;
    }
    const bankW = bank(-1), bankE = bank(1);
    grp.add(bankW, bankE);

    scene.add(grp);
    return { grp, water, bed, bankW, bankE, waterMat, bankTopMat };
  }

  /* ---------------- ground plane (huge, dark) ---------------- */
  const ground = new V.Mesh(
    new V.PlaneGeometry(400, 400),
    new V.MeshStandardMaterial({ color: 0x14181f, roughness: 1 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -2.01;
  ground.receiveShadow = true;
  scene.add(ground);

  /* ---------------- HUD ---------------- */
  const hudBlocks = document.getElementById('hud-blocks');
  const hudRiver = document.getElementById('hud-river');
  function updateHUD() {
    hudBlocks.innerHTML = 'Blocks: <b>' + S.count + '</b>';
    hudRiver.innerHTML = 'River: <b>' + (S.river) + ' u</b>';
  }

  /* ---------------- log ---------------- */
  const logEl = document.getElementById('log');
  const LOG_EMPTY = '<div class="log-empty">Reasoning steps will appear here as the scene animates…</div>';
  logEl.innerHTML = LOG_EMPTY;
  function stamp() {
    const t = (performance.now() - S.logT0) / 1000;
    const m = Math.floor(t / 60), s = (t % 60).toFixed(1).padStart(4, '0');
    return (m > 0 ? m + ':' : '') + s.padStart(m > 0 ? 4 : 5, m > 0 ? '0' : '0') + 's';
  }
  function log(text, kind) {
    if (logEl.querySelector('.log-empty')) logEl.innerHTML = '';
    const d = document.createElement('div');
    d.className = 'log-entry ' + (kind || 'info');
    d.innerHTML = '<span class="t">[' + stamp() + ']</span>' + text;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
  }

  /* ---------------- animation engine ---------------- */
  const easeInOut = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  const easeOutBack = t => { const c = 1.70158 * 0.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
  function animate(opts) {
    // opts: {dur, onUpdate(t01), onDone}
    return new Promise(res => {
      S.anims.push({ start: S.clock.getElapsedTime(), dur: opts.dur, onUpdate: opts.onUpdate, onDone: () => { opts.onDone && opts.onDone(); res(); } });
    });
  }
  function tick() {
    requestAnimationFrame(tick);
    const now = S.clock.getElapsedTime();
    for (let i = S.anims.length - 1; i >= 0; i--) {
      const a = S.anims[i];
      let t = (now - a.start) / a.dur;
      if (t >= 1) t = 1;
      a.onUpdate(t);
      if (t === 1) { S.anims.splice(i, 1); a.onDone(); }
    }
    // gentle auto orbit when idle (no drag recently)
    if (!orbit.drag && Math.abs(now - lastInteract) > 4) orbit.theta += 0.0012;
    applyCamera();
    renderer.render(scene, camera);
  }
  let lastInteract = -10;
  ['pointerdown', 'wheel'].forEach(ev => canvas.addEventListener(ev, () => lastInteract = S.clock.getElapsedTime()));

  /* ---------------- block factory ---------------- */
  function makeBlock(gx, gy, gz, colorName) {
    const mesh = new V.Mesh(VOXEL_GEO, MATS[colorName]);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    mesh.position.set(gx, gy, gz);
    const b = { id: S.nextId++, mesh, gx, gy, gz, color: colorName };
    S.blocks.set(b.id, b);
    scene.add(mesh);
    S.count++;
    updateHUD();
    return b;
  }
  function killBlock(b) {
    scene.remove(b.mesh);
    S.blocks.delete(b.id);
    S.count--;
    updateHUD();
  }
  const roleOf = b => (b.gy === DECK_Y ? 'deck' : (b.gz === SPINE_Z ? 'keel' : 'arch'));

  /* ---------------- scenario builders ---------------- */

  // exact original 40 layout
  function layoutOriginal40() {
    const list = [];
    for (let x = 0; x < RIVER0; x++)
      for (let z = 0; z < 2; z++)
        list.push({ x, y: ARCH_Y, z, c: colorOf(x, ARCH_Y, z), role: 'arch' });
    for (let x = 0; x < RIVER0; x++)
      for (let z = 0; z < 2; z++)
        list.push({ x, y: DECK_Y, z, c: colorOf(x, DECK_Y, z), role: 'deck' });
    return list;
  }

  // 38-block rebuilt layout on 10-wide river (post quake):
  // arch = x 0..9, z 0..1, minus (0,0,0) & (9,0,1) [moved to pier], deck unchanged
  function layoutRebuilt38() {
    const list = [];
    for (let x = 0; x < RIVER0; x++)
      for (let z = 0; z < 2; z++) {
        if ((x === 0 && z === 0) || (x === 9 && z === 1)) continue;
        list.push({ x, y: ARCH_Y, z, c: colorOf(x, ARCH_Y, z), role: 'arch' });
      }
    for (let x = 0; x < RIVER0; x++)
      for (let z = 0; z < 2; z++)
        list.push({ x, y: DECK_Y, z, c: colorOf(x, DECK_Y, z), role: 'deck' });
    // pier rebuilt from moved blocks: (4,0,0) colored red (came from (0,0,0)), (4,0,1) green (from (9,0,1))
    list.push({ x: 4, y: ARCH_Y, z: 0, c: colorOf(0, ARCH_Y, 0), role: 'arch', movedFrom: [0, 0, 0] });
    list.push({ x: 4, y: ARCH_Y, z: 1, c: colorOf(9, ARCH_Y, 1), role: 'arch', movedFrom: [9, 0, 1] });
    return list;
  }

  // 38-block widened (14) layout:
  // deck x=0..13 z=0..1 (28): original 20 keep color; the 8 new deck cells x=10..13
  //   are filled by arch blocks chosen to match pattern color: we pick from freed arch
  // keel spine: x=2..11, y=0, z=0.5 (10 blocks) colors from remaining arch blocks
  function layoutWidened38() {
    const list = [];
    // original deck 20 keep their colors/positions
    for (let x = 0; x < RIVER0; x++)
      for (let z = 0; z < 2; z++)
        list.push({ x, y: DECK_Y, z, c: colorOf(x, DECK_Y, z), role: 'deck' });
    // deck additions x=10..13, colors match deck pattern; sourced from arch pool
    const additions = [
      { x: 10, z: 0, from: [1, 0, 1] }, { x: 10, z: 1, from: [3, 0, 1] },
      { x: 11, z: 0, from: [5, 0, 1] }, { x: 11, z: 1, from: [2, 0, 1] },
      { x: 12, z: 0, from: [2, 0, 0] }, { x: 12, z: 1, from: [5, 0, 0] },
      { x: 13, z: 0, from: [6, 0, 0] }, { x: 13, z: 1, from: [7, 0, 0] },
    ];
    for (const a of additions)
      list.push({ x: a.x, y: DECK_Y, z: a.z, c: colorOf(a.x, DECK_Y, a.z), role: 'deck', movedFrom: a.from });
    // keel spine x=2..11 at z=0.5; colors from remaining arch pool
    const keelFrom = [
      [0, 1], [4, 1], [8, 1], [6, 1], [1, 0], [3, 0], [8, 0], [6, 0], [9, 0], [7, 1],
    ];
    for (let i = 0; i < 10; i++) {
      const x = 2 + i;
      const [fx, fz] = keelFrom[i];
      list.push({ x, y: ARCH_Y, z: SPINE_Z, c: colorOf(fx, ARCH_Y, fz), role: 'keel', movedFrom: [fx, 0, fz] });
    }
    return list;
  }

  /* ---------------- stage transitions ---------------- */

  async function doBuild() {
    if (S.busy || S.phase !== 'idle') return;
    S.busy = true; setButtons();
    S.phase = 'building';
    S.logT0 = performance.now();
    log('Plan: build a two-lane arch bridge, ten units of river to cross. Budget: exactly forty blocks.', 'build');

    const cells = layoutOriginal40();
    // counts per color
    const counts = {};
    cells.forEach(c => counts[c.c] = (counts[c.c] || 0) + 1);

    // arch first, then deck, with slight stagger + drop-in animation
    const archCells = cells.filter(c => c.role === 'arch');
    const deckCells = cells.filter(c => c.role === 'deck');
    const DUR = 0.55;
    let placed = 0;

    log('Laying the arch springs: two lanes of ten blocks, resting on both abutments at deck level.', 'build');
    for (let i = 0; i < archCells.length; i++) {
      const c = archCells[i];
      const b = makeBlock(c.x, c.y + 6, c.z, c.c); // spawn high
      b.mesh.position.y = c.y + 5;
      b.mesh.scale.setScalar(0.2);
      animate({
        dur: DUR,
        onUpdate: t => {
          const e = easeOutBack(t);
          b.mesh.position.y = c.y + 5 * (1 - e);
          b.mesh.scale.setScalar(0.2 + 0.8 * Math.min(1, t * 1.4));
        },
        onDone: () => { b.gy = c.y; b.mesh.position.set(c.x, c.y, c.z); b.mesh.scale.setScalar(1); },
      });
      await waitMs(28);
      placed++;
    }
    log('Arch complete — twenty blocks form the spanning curve under the deck.', 'build');
    for (let i = 0; i < deckCells.length; i++) {
      const c = deckCells[i];
      const b = makeBlock(c.x, c.y + 6, c.z, c.c);
      b.mesh.position.y = c.y + 5;
      b.mesh.scale.setScalar(0.2);
      animate({
        dur: DUR,
        onUpdate: t => {
          const e = easeOutBack(t);
          b.mesh.position.y = c.y + 5 * (1 - e);
          b.mesh.scale.setScalar(0.2 + 0.8 * Math.min(1, t * 1.4));
        },
        onDone: () => { b.gy = c.y; b.mesh.position.set(c.x, c.y, c.z); b.mesh.scale.setScalar(1); },
      });
      await waitMs(28);
      placed++;
    }
    await waitMs(DUR * 1000 + 100);

    log('Walkway on top: twenty blocks, two wide, flush with both banks.', 'build');
    const perColor = PAL.map(p => p + ': ' + (counts[p] || 0)).join(' &nbsp;·&nbsp; ');
    log('Block census — exactly 40 placed. Per color: ' + perColor, 'build');
    S.phase = 'built';
    S.busy = false; setButtons();
  }

  function findBlockAt(x, y, z) {
    for (const b of S.blocks.values())
      if (b.gx === x && b.gy === y && b.gz === z) return b;
    return null;
  }

  async function doQuake() {
    if (S.busy || S.phase !== 'built') return;
    S.busy = true; setButtons();
    S.phase = 'quake';
    log('SEISMIC EVENT — magnitude spike at river center. Scanning structure…', 'quake');

    // camera shake
    const t0 = S.clock.getElapsedTime();
    animate({
      dur: 1.6,
      onUpdate: t => {
        const decay = Math.sin(t * Math.PI);
        camera.position.x += Math.sin(t * 55) * 0.09 * decay;
        camera.position.y += Math.cos(t * 47) * 0.06 * decay;
      },
    });

    await waitMs(500);
    // destroy pier blocks at (4,0,0) and (4,0,1)
    for (const z of [0, 1]) {
      const b = findBlockAt(4, ARCH_Y, z);
      if (!b) continue;
      log('Central pier block at (4, 0, ' + z + ') sheared off — losing support under the crown.', 'quake');
      const sink = b.mesh.position.y - 1.6;
      const rot = (Math.random() - 0.5) * 2.5;
      animate({
        dur: 1.1,
        onUpdate: t => {
          b.mesh.position.y = b.gy - 1.7 * t * t;
          b.mesh.rotation.z = rot * t;
        },
        onDone: () => { killBlock(b); },
      });
      await waitMs(180);
    }
    // deck sag
    for (const z of [0, 1]) {
      const b = findBlockAt(4, DECK_Y, z);
      if (!b) continue;
      animate({
        dur: 0.9,
        onUpdate: t => { b.mesh.position.y = DECK_Y - 0.38 * Math.sin(t * Math.PI); },
        onDone: () => { b.mesh.position.y = DECK_Y; },
      });
    }
    await waitMs(1400);
    log('Two central support blocks destroyed. Thirty-eight blocks remain — the deck at midspan is unsupported.', 'quake');
    S.phase = 'rebuilt-pending';
    S.busy = false; setButtons();
    // auto rebuild
    await doRebuild();
  }

  async function doRebuild() {
    if (S.busy || S.phase !== 'rebuilt-pending') return;
    S.busy = true; setButtons();
    S.phase = 'rebuilding';
    log('Autonomous repair: re-spanning the gap with the remaining thirty-eight blocks.', 'build');

    // Move arch end blocks into pier positions
    const moves = [
      { from: [0, ARCH_Y, 0], to: [4, ARCH_Y, 0], why: 'west end arch block flies to the crown: end decks cantilever onto the bank abutment, so the end block is redundant there' },
      { from: [9, ARCH_Y, 1], to: [4, ARCH_Y, 1], why: 'east end arch block flies to the crown to close the second lane\'s gap' },
    ];
    for (const m of moves) {
      const b = findBlockAt(...m.from);
      if (!b) { log('block missing ' + m.from, 'quake'); continue; }
      const [fx, fy, fz] = m.from, [tx, ty, tz] = m.to;
      log('Moving block (' + fx + ',' + fy + ',' + fz + ') → (' + tx + ',' + ty + ',' + tz + '): ' + m.why + '.', 'build');
      const arc = new V.CubicBezierCurve3(
        new V.Vector3(fx, fy, fz),
        new V.Vector3(fx * 0.7 + tx * 0.3, fy + 3.4, fz),
        new V.Vector3(fx * 0.3 + tx * 0.7, ty + 3.4, fz),
        new V.Vector3(tx, ty, tz)
      );
      b.mesh.rotation.z = 0;
      animate({
        dur: 0.9,
        onUpdate: t => {
          const p = arc.getPoint(easeInOut(t));
          b.mesh.position.copy(p);
          b.mesh.rotation.y = t * Math.PI * 0.9;
        },
        onDone: () => {
          b.gx = tx; b.gy = ty; b.gz = tz;
          b.mesh.position.set(tx, ty, tz);
          b.mesh.rotation.set(0, 0, 0);
        },
      });
      await waitMs(950);
    }

    // re-seat deck blocks at x=4 (they sagged during quake)
    for (const z of [0, 1]) {
      const b = findBlockAt(4, DECK_Y, z);
      if (b) {
        animate({
          dur: 0.5,
          onUpdate: t => { b.mesh.position.y = DECK_Y - 0.38 * (1 - easeInOut(t)); },
          onDone: () => { b.mesh.position.y = DECK_Y; },
        });
      }
    }
    await waitMs(600);
    log('Rebuild complete: arch crown restored, both lanes continuous. Structure verified sound — 38 blocks standing.', 'build');
    S.phase = 'rebuilt';
    S.busy = false; setButtons();
  }

  async function doWiden() {
    if (S.busy || S.phase !== 'rebuilt') return;
    S.busy = true; setButtons();
    S.phase = 'widening';
    log('Hydro survey: river carving outward. Widening from ten to fourteen units.', 'widen');

    // 1) animate terrain
    const oldW = S.river, newW = RIVER1;
    // east bank group moves +4 over time
    const startX = S.terr.bankE.position.x;
    animate({
      dur: 1.8,
      onUpdate: t => {
        const e = easeInOut(t);
        S.terr.bankE.position.x = 4 * e;
        S.terr.water.scale.x = 1 + 0.4 * e;
        S.terr.water.position.x = (oldW - 1) / 2 + (4 * e) / 2;
        S.terr.bed.scale.x = 1 + 0.4 * e;
        S.terr.bed.position.x = (oldW - 1) / 2 + (4 * e) / 2;
      },
      onDone: () => {
        S.river = newW;
        updateHUD();
      },
    });
    log('East bank recedes four units; channel widens in place.', 'widen');
    await waitMs(1900);

    // 2) reconfigure bridge with same 38 blocks
    // current state: deck 20 @ x0..9 + arch 18 (crown pair at x=4 both lanes + 16 others)
    // plan: 8 arch blocks -> deck x=10..13 (both lanes), 10 arch blocks -> keel spine
    const toDeck = [
      { from: [1, 0, 1], to: [10, 1, 0] }, { from: [3, 0, 1], to: [10, 1, 1] },
      { from: [5, 0, 1], to: [11, 1, 0] }, { from: [2, 0, 1], to: [11, 1, 1] },
      { from: [2, 0, 0], to: [12, 1, 0] }, { from: [5, 0, 0], to: [12, 1, 1] },
      { from: [6, 0, 0], to: [13, 1, 0] }, { from: [7, 0, 0], to: [13, 1, 1] },
    ];
    const toKeel = [
      [0, 1], [4, 1], [8, 1], [6, 1], [1, 0], [3, 0], [8, 0], [6, 0], [9, 0], [7, 1],
    ];
    log('Restructuring: eight arch blocks become deck at x=10…13; ten arch blocks become a keel spine under the deck\'s centerline.', 'widen');

    let i = 0;
    for (const m of toDeck) {
      const b = findBlockAt(...m.from);
      if (!b) { i++; continue; }
      const [fx, fy, fz] = m.from, [tx, ty, tz] = m.to;
      const arc = new V.CubicBezierCurve3(
        new V.Vector3(fx, fy, fz),
        new V.Vector3(fx * 0.7 + tx * 0.3, fy + 2.6, fz),
        new V.Vector3(fx * 0.3 + tx * 0.7, ty + 2.6, fz),
        new V.Vector3(tx, ty, tz)
      );
      animate({
        dur: 0.75,
        onUpdate: t => {
          const p = arc.getPoint(easeInOut(t));
          b.mesh.position.copy(p);
          b.mesh.rotation.y = t * Math.PI * 0.7;
        },
        onDone: () => {
          b.gx = tx; b.gy = ty; b.gz = tz;
          b.mesh.position.set(tx, ty, tz);
          b.mesh.rotation.set(0, 0, 0);
        },
      });
      log('Deck extension: arch block (' + fx + ',' + fy + ',' + fz + ') → deck (' + tx + ',' + ty + ',' + tz + ') — spans the new east channel.', 'widen');
      await waitMs(140);
      i++;
    }
    await waitMs(900);

    let k = 0;
    for (const [fx, fz] of toKeel) {
      const b = findBlockAt(fx, ARCH_Y, fz);
      if (!b) { k++; continue; }
      const tx = 2 + k, ty = ARCH_Y, tz = SPINE_Z;
      const arc = new V.CubicBezierCurve3(
        new V.Vector3(fx, ARCH_Y, fz),
        new V.Vector3(fx * 0.7 + tx * 0.3, ARCH_Y + 2.2, fz),
        new V.Vector3(fx * 0.3 + tx * 0.7, ARCH_Y + 2.2, tz),
        new V.Vector3(tx, ty, tz)
      );
      animate({
        dur: 0.7,
        onUpdate: t => {
          const p = arc.getPoint(easeInOut(t));
          b.mesh.position.copy(p);
          b.mesh.rotation.y = t * Math.PI * 0.7;
        },
        onDone: () => {
          b.gx = tx; b.gy = ty; b.gz = tz;
          b.mesh.position.set(tx, ty, tz);
          b.mesh.rotation.set(0, 0, 0);
        },
      });
      await waitMs(120);
      k++;
    }
    log('Keel spine set: ten blocks run x=2…11 at half-lane depth, supporting both deck lanes\' inner edges.', 'widen');
    await waitMs(1000);
    log('Widen complete: river ' + RIVER1 + ' u, bridge spans ' + RIVER1 + ' u with ' + S.count + ' blocks (deck ' + RIVER1 * 2 + ' + keel 10). Zero blocks gained or lost.', 'widen');
    S.phase = 'widened';
    S.busy = false; setButtons();
  }

  async function doReset() {
    if (S.busy) return;
    S.busy = true; setButtons();
    // quick shrink-out of all blocks
    const all = [...S.blocks.values()];
    all.forEach((b, idx) => {
      animate({
        dur: 0.4 + idx * 0.008,
        onUpdate: t => { b.mesh.scale.setScalar(1 - t); b.mesh.position.y = b.gy + t * 2.2; },
        onDone: () => killBlock(b),
      });
    });
    log('Reset: releasing all ' + all.length + ' blocks back to inventory.', 'info');
    // terrain back to 10 wide
    const startX = S.terr.bankE.position.x;
    animate({
      dur: 0.9,
      onUpdate: t => {
        const e = easeInOut(t);
        S.terr.bankE.position.x = startX * (1 - e);
        S.terr.water.scale.x = 1 + 0.4 * (1 - e);
        S.terr.water.position.x = (RIVER0 - 1) / 2 + (4 * (1 - e)) / 2;
        S.terr.bed.scale.x = 1 + 0.4 * (1 - e);
        S.terr.bed.position.x = (RIVER0 - 1) / 2 + (4 * (1 - e)) / 2;
      },
      onDone: () => {
        S.river = RIVER0;
        updateHUD();
        S.phase = 'idle';
        S.busy = false; setButtons();
        log('Terrain restored to ten-unit channel. Ready for a new build.', 'info');
      },
    });
    await waitMs(1200);
  }

  /* ---------------- buttons ---------------- */
  const btnBuild = document.getElementById('btn-build');
  const btnQuake = document.getElementById('btn-quake');
  const btnWiden = document.getElementById('btn-widen');
  const btnReset = document.getElementById('btn-reset');
  function setButtons() {
    btnBuild.disabled = S.busy || S.phase !== 'idle';
    btnQuake.disabled = S.busy || S.phase !== 'built';
    btnWiden.disabled = S.busy || S.phase !== 'rebuilt';
    btnReset.disabled = S.busy || S.phase === 'idle';
  }
  btnBuild.onclick = doBuild;
  btnQuake.onclick = doQuake;
  btnWiden.onclick = doWiden;
  btnReset.onclick = doReset;
  setButtons();

  function waitMs(ms) { return new Promise(r => setTimeout(r, ms)); }

  /* ---------------- resize ---------------- */
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  /* ---------------- boot ---------------- */
  S.terr = buildTerrain(RIVER0);
  S.clock = new V.Clock();
  S.logT0 = performance.now();
  updateHUD();
  applyCamera();
  tick();
  window.__appBoot();
})();

</script>
</body>
</html>
