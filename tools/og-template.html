<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* 1200x630 OG card. Safe margins: 80px sides, 64px top/bottom. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #0a0e14;
    color: #c5cdd8;
    font-family: 'JetBrains Mono', monospace;
    padding: 64px 80px;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  body::before {
    content: "";
    position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.12) 2px, rgba(0,0,0,0.12) 4px);
    pointer-events: none;
  }
  .frame {
    position: absolute; inset: 24px;
    border: 1px solid #1e2a36; border-radius: 12px;
  }
  .prompt { color: #00ff41; opacity: 0.8; font-size: 26px; }
  .logo { color: #00ff41; font-size: 112px; font-weight: 700; line-height: 1.05; margin: 18px 0 26px; letter-spacing: -2px; }
  .tagline { color: #e8edf3; font-size: 30px; white-space: nowrap; font-weight: 500; line-height: 1.35; }
  .hero { color: #c5cdd8; font-size: 28px; line-height: 1.45; margin-top: 22px; max-width: 1000px; }
  .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: baseline; font-size: 26px; }
  .domain { color: #00ff41; font-weight: 500; }
  .dim { color: #5a6a7a; }
</style>
</head>
<body>
  <div class="frame"></div>
  <p class="prompt">$ whoami</p>
  <p class="logo">jvr0x_</p>
  <p class="tagline">Javier &bull; priv/acc | Local AI, security, privacy &amp; crypto</p>
  <p class="hero">I run 3&times; DGX Spark and publish open benchmarks, recipes and fine-tunes.</p>
  <div class="foot"><span class="domain">jvr0x.com</span><span class="dim">models &middot; recipes &middot; benchmarks</span></div>
</body>
</html>
